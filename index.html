<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>PracOx — Practice Through Failure</title>
<meta name="description" content="Practice exams for Class 1-12, CM Kids, and NMMS." />
<meta name="theme-color" content="#16233F" />
<link rel="manifest" href="manifest.json" />

<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?external=react",
    "firebase/app": "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js",
    "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"
  }
}
</script>

<style>
  html, body { margin: 0; padding: 0; background: #F1F3F6; }
  #root { min-height: 100vh; }
  #boot-error { display:none; font-family: monospace; font-size: 13px; white-space: pre-wrap; color: #C1443D; background: #FBEAE9; border: 1px solid #F0D3D1; margin: 16px; padding: 14px; border-radius: 8px; }
</style>
</head>
<body>
<div id="root"></div>
<div id="boot-error"></div>
<script>
  function showBootError(msg) {
    var el = document.getElementById('boot-error');
    el.textContent = 'Startup error:\n\n' + msg;
    el.style.display = 'block';
  }
  window.addEventListener('error', function (e) {
    showBootError((e.error && e.error.stack) || e.message || String(e));
  });
  window.addEventListener('unhandledrejection', function (e) {
    showBootError((e.reason && (e.reason.stack || e.reason.message)) || String(e.reason));
  });
</script>
<script>
  import('./entry.js').catch(function (err) {
    showBootError((err && (err.stack || err.message)) || String(err));
  });
</script>
</body>
</html>
